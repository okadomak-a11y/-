<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Формы Dr Pepper</title>
</head>
<body>
<header class="site-header"><div class="header-inner">
    <a class="brand" href="../index.html" target="_self">Dr Pepper</a><p class="tagline">История, вкус и немного учебного HTML</p>
    <nav class="main-nav" aria-label="Основная навигация"><a href="../index.html" target="_self"><img src="../table/images-2.jpeg" width="30" height="30" alt="Главная страница Dr Pepper"></a><a href="../index.html" target="_self">Главная</a><a href="about.html">История</a><a href="products.html">Вкусы и таблица</a><strong class="active" aria-current="page">Формы</strong><a href="../паспорт/index.html">Задания 13–14</a><a href="algorithm.html">Задача №1003</a><a href="products.html#gallery">Альбом</a><a href="https://www.drpepper.com/" target="_blank" rel="noopener">Официальный сайт</a></nav>
</div></header>
<main>
    <h1>Связаться и сделать заказ</h1>
    <nav class="page-nav"><a href="#contact">Контакты</a><a href="#order">Заказ</a><a href="#start">К началу</a></nav>
    <section id="contact"><h2>Контактные данные</h2>
        <form action="https://httpbin.org/post" method="post">
            <label>Фамилия <input type="text" name="surname" value="Багиров" required></label>
            <label>Имя <input type="text" name="name" value="Эльнур" required></label>
            <label>Группа <input type="text" name="group" value="Г06У28" required></label>
            <label>Мобильный телефон <input type="tel" name="phone" value="+79990000000" required></label>
            <label>Электронная почта <input type="email" name="email" value="student@example.com" required></label>
            <label>Дата отправки <input type="date" name="send_date" required></label>
            <button type="submit">Отправить данные</button>
        </form>
    </section>
    <section id="order"><h2>Заказ Dr Pepper</h2>
        <form action="https://httpbin.org/post" method="post">
            <input type="hidden" name="form_type" value="dr_pepper_order">
            <label>Ваше имя <input type="text" name="customer_name" value="Эльнур" required></label>
            <label>Количество упаковок <input type="number" name="boxes" value="1" min="1" max="20" required></label>
            <fieldset><legend>Вариант напитка</legend><label><input type="radio" name="flavor" value="classic" checked> Classic</label><label><input type="radio" name="flavor" value="zero"> Zero Sugar</label><label><input type="radio" name="flavor" value="cherry"> Cherry</label></fieldset>
            <label><input type="checkbox" name="subscribe" value="yes" checked> Получать новости о новых вкусах</label>
            <label>Дата доставки <input type="date" name="delivery_date"></label>
            <label>Код подтверждения <input type="password" name="order_password"></label>
            <button type="submit">Отправить заказ</button>
        </form>
    </section>
    <p id="start"><a href="#start">К началу страницы</a></p>
</main>
<footer class="site-footer">Учебный проект о Dr Pepper</footer>
</body>
</html>
