<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <title>Задание 2 - Таблица</title>

    <style>

        /* =====================================================
           ОБЩИЕ НАСТРОЙКИ СТРАНИЦЫ
           ===================================================== */

        body {
            /* Фоновая картинка страницы 1366x768 */
            background-image: url("../table/images-2.jpeg");

            /* Картинка занимает весь экран */
            background-size: cover;

            /* Картинка не повторяется */
            background-repeat: no-repeat;

            /* Таблица будет по центру */
            margin: 0;
        }


        /* =====================================================
           ГЛАВНАЯ ТАБЛИЦА
           ===================================================== */

        .main-table {

            /* Ширина таблицы */
            width: 600px;

            /* Серый фон */
            background-color: gray;

            /* Расстояние между ячейками */
            border-spacing: 15px;

            /* Таблица по центру */
            margin: 50px auto;

            /* Границы */
            border: 2px solid red;
        }


        /* =====================================================
           ВСЕ ЯЧЕЙКИ ГЛАВНОЙ ТАБЛИЦЫ
           ===================================================== */

        .main-table td {

            /* Граница каждой ячейки */
            border: 2px solid red;

            /* Отступ содержимого от границы */
            padding: 10px;
        }


        /* =====================================================
           ПЕРВЫЙ РЯД
           ===================================================== */

        .first-row {
            height: 100px;
        }


        /* Первая ячейка первого ряда */

        .logo-cell {
            text-align: center;
            vertical-align: top;
        }


        /* Картинка в первой ячейке */

        .logo-cell img {
            height: 50px;

            /* Сдвигаем картинку вверх */
            vertical-align: top;
        }


        /* Подпись под картинкой */

        .logo-text {
            text-align: center;
        }


        /* Третья ячейка первого ряда */

        .background-cell {

            width: 200px;

            /* Фоновая картинка */
            background-image: url("../table/images-2.jpeg");

            background-size: cover;
        }


        /* =====================================================
           ВТОРОЙ РЯД
           ===================================================== */

        .second-row {
            height: 20px;
        }


        /* =====================================================
           ТРЕТИЙ РЯД
           ===================================================== */

        .third-row {
            height: 300px;
        }


        /* Первая ячейка третьего ряда */

        .large-cell {
            width: 400px;
        }


        /* Вторая ячейка третьего ряда */

        .green-cell {
            background-color: green;
        }


        /* =====================================================
           ЧЕТВЁРТЫЙ РЯД
           ===================================================== */

        .fourth-row {
            height: 200px;
        }


        /* Левая ячейка четвёртого ряда */

        .left-cell {
            width: 50%;
        }


        /* Вложенная таблица */

        .inner-table {

            width: 100%;

            border-spacing: 5px;
        }


        /* Ячейки вложенной таблицы */

        .inner-table td {

            border: 2px solid red;

            padding: 20px;
        }


        /* Правая ячейка четвёртого ряда */

        .right-cell {
            text-align: right;

            padding: 15px;
        }


        /* Картинка справа */

        .right-cell img {

            /* Отступ от правой границы */
            margin-left: auto;

            display: block;
        }

    </style>

</head>


<body>


    <!-- =====================================================
         ГЛАВНАЯ ТАБЛИЦА
         ===================================================== -->

    <table class="main-table">


        <!-- =================================================
             ПЕРВЫЙ РЯД
             ================================================= -->

        <tr class="first-row">


            <!-- 1-я ячейка -->

            <td class="logo-cell">

                <img src="../030_images/perl.gif" alt="Логотип">

                <div class="logo-text">
                    Логотип
                </div>

            </td>


            <!-- 2-я ячейка - пустая -->

            <td>

            </td>


            <!-- 3-я ячейка -->
            <!-- ширина 200px + фоновая картинка -->

            <td class="background-cell">

            </td>


        </tr>



        <!-- =================================================
             ВТОРОЙ РЯД
             ================================================= -->

        <tr class="second-row">

            <!-- colspan="3" объединяет 3 столбца -->

            <td colspan="3">

            </td>

        </tr>



        <!-- =================================================
             ТРЕТИЙ РЯД
             ================================================= -->

        <tr class="third-row">


            <!-- 1-я ячейка шириной 400px -->

            <td class="large-cell">

                Большая ячейка
                <br>
                Ширина: 400px
                <br>
                Высота: 300px

            </td>


            <!-- 2-я ячейка с зелёным фоном -->

            <td class="green-cell">

                Зелёная ячейка

            </td>


        </tr>



        <!-- =================================================
             ЧЕТВЁРТЫЙ РЯД
             ================================================= -->

        <tr class="fourth-row">


            <!-- =================================================
                 ЛЕВАЯ ЯЧЕЙКА
                 ================================================= -->

            <td class="left-cell">


                <!-- Вложенная таблица -->

                <table class="inner-table">


                    <!-- Первая строка вложенной таблицы -->

                    <tr>

                        <!-- Верхняя левая ячейка -->

                        <td>

                            <img
                                src="../030_images/perl.gif"
                                width="100"
                                alt="Изображение"
                            >

                        </td>


                        <!-- Верхняя правая ячейка -->

                        <td>

                        </td>

                    </tr>


                    <!-- Вторая строка вложенной таблицы -->

                    <tr>

                        <td>

                        </td>

                        <td>

                        </td>

                    </tr>


                </table>

            </td>



            <!-- =================================================
                 ПРАВАЯ ЯЧЕЙКА
                 ================================================= -->

            <td class="right-cell">

                <img
                    src="../030_images/perl.gif"
                    width="150"
                    alt="Изображение справа"
                >

            </td>


        </tr>


    </table>


</body>

</html>
```
